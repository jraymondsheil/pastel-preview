<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work | Pastel</title>
  <meta name="description" content="Websites and brand identities by Pastel for apartment communities, townhomes and residential portfolios.">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Newsreader:opsz,wght@6..72,300..500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css?v=16">
  <script>document.documentElement.className = "js";</script>
</head>
<body data-footer-on="tint">

<main id="main">

  <!-- Same opening as a home page section: the name in the margin, the
       headline beside it. -->
  <section class="page-head">
    <div class="wrap">
      <div class="rail-layout">
        <div class="rail" data-reveal><p class="label">Work</p></div>
        <div>
          <h1 class="h-xl" data-reveal>Brands and websites for the places people live<span class="stop">.</span></h1>
          <p class="lede" data-reveal style="--d:.1s">Projects for townhomes, apartment communities and their owners.</p>
        </div>
      </div>
    </div>
  </section>

  <!-- One project per row, drawn by js/work.js: the screens stand on a
       Pastel colour and a ground line, with the credit beneath. -->
  <section class="section work-rows">
    <div class="wrap">
      <div class="work-list" data-work="all"></div>
    </div>
  </section>

  <section class="section section--tint">
    <div class="wrap">
      <div class="rail-layout">
        <div class="rail" data-reveal><p class="label">Start a project</p></div>
        <div>
          <h2 class="h-xl" data-reveal>Your property could be next<span class="stop">.</span></h2>
          <p class="work__next" data-reveal style="--d:.1s"><a class="btn" href="index.html#contact">Tell us about it</a></p>
        </div>
      </div>
    </div>
  </section>

</main>

<script src="js/work.js?v=16"></script>
<script src="js/site.js?v=16"></script>
</body>
</html>
